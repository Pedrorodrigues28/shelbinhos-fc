<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Entrar | Shelbinhos FC</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>

<header class="topo">

    <a
        href="index.html"
        class="marca"
    >

        <img
            src="imagens/escudo/escudo.png"
            alt="Escudo do Shelbinhos FC"
            class="mini-escudo-img"
        >

        <div>

            <strong>
                Shelbinhos FC
            </strong>

            <small>
                EST. 2026
            </small>

        </div>

    </a>


    <nav>

        <a href="index.html">
            Início
        </a>

        <a href="loja.html">
            Loja
        </a>

        <a href="jogadores.html">
            Elenco
        </a>

        <a
            href="destaques.html"
            class="destaque-emoji"
            title="Highlights"
        >
            😈
        </a>

        <a href="carrinho.html">

            Carrinho

            <span class="cart-count">
                0
            </span>

        </a>

        <a
            href="login.html"
            class="auth-menu-link ativo"
        >
            Entrar
        </a>

    </nav>

</header>


<main class="auth-page">

    <section class="auth-container">

        <div class="auth-box">

            <p class="auth-mini-title">
                SHELBINHOS FC
            </p>

            <h1>
                Entrar
            </h1>

            <p class="auth-descricao">
                Entre na sua conta para continuar.
            </p>


            <form
                id="form-login"
                class="auth-form"
            >

                <div class="input-group">

                    <label for="login-email">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="login-email"
                        placeholder="seuemail@email.com"
                        required
                    >

                </div>


                <div class="input-group">

                    <label for="login-senha">
                        Senha
                    </label>

                    <input
                        type="password"
                        id="login-senha"
                        placeholder="Sua senha"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="auth-botao"
                >
                    Entrar
                </button>

            </form>


            <p id="mensagem-auth"></p>


            <p class="auth-link">

                Ainda não possui conta?

                <a href="cadastro.html">
                    Criar conta
                </a>

            </p>

        </div>

    </section>

</main>


<script src="js/script.js"></script>

<script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>

<script src="js/supabase.js"></script>

<script src="js/auth.js"></script>

</body>

</html>
