<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ONG Rodrigues - Cadastro</title>

    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
</head>

<body>

    <header class="topo">

        <div class="topo-conteudo">

            <h1>ONG RODRIGUES</h1>

            <button
                class="menu-toggle"
                id="menuToggle"
                aria-label="Abrir menu"
                aria-expanded="false"
                aria-controls="menuPrincipal">
                ☰
            </button>

            <nav id="menuPrincipal" aria-label="Navegação principal">
                <a href="index.html">Início</a>
                <a href="projetos.html">Projetos</a>
                <a href="cadastro.html">Cadastro</a>
            </nav>

        </div>

    </header>


    <main>

        <section>

            <h2>Faça seu cadastro</h2>

            <p>
                Preencha seus dados para demonstrar interesse em participar
                das ações da ONG.
            </p>


            <form id="formCadastro" novalidate>

                <fieldset>

                    <legend>Dados pessoais</legend>


                    <div class="campo">

                        <label for="nome">
                            Nome completo:
                        </label>

                        <input
                            type="text"
                            id="nome"
                            name="nome"
                            autocomplete="name"
                            required>

                        <small class="mensagem-erro"></small>

                    </div>


                    <div class="campo">

                        <label for="email">
                            E-mail:
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            autocomplete="email"
                            required>

                        <small class="mensagem-erro"></small>

                    </div>


                    <div class="campo">

                        <label for="nascimento">
                            Data de nascimento:
                        </label>

                        <input
                            type="date"
                            id="nascimento"
                            name="nascimento">

                        <small class="mensagem-erro"></small>

                    </div>


                    <div class="campo">

                        <label for="cpf">
                            CPF:
                        </label>

                        <input
                            type="text"
                            id="cpf"
                            name="cpf"
                            placeholder="000.000.000-00"
                            pattern="\d{3}\.\d{3}\.\d{3}-\d{2}"
                            inputmode="numeric"
                            required>

                        <small class="mensagem-erro"></small>

                    </div>


                    <div class="campo">

                        <label for="telefone">
                            Telefone:
                        </label>

                        <input
                            type="tel"
                            id="telefone"
                            name="telefone"
                            placeholder="(11) 99999-9999"
                            autocomplete="tel"
                            pattern="\(\d{2}\)\s?\d{4,5}-\d{4}">

                        <small class="mensagem-erro"></small>

                    </div>


                    <div class="campo">

                        <label for="cep">
                            CEP:
                        </label>

                        <input
                            type="text"
                            id="cep"
                            name="cep"
                            placeholder="00000-000"
                            inputmode="numeric"
                            pattern="\d{5}-\d{3}">

                        <small class="mensagem-erro"></small>

                    </div>


                    <div class="campo">

                        <label for="cidade">
                            Cidade:
                        </label>

                        <input
                            type="text"
                            id="cidade"
                            name="cidade"
                            autocomplete="address-level2">

                        <small class="mensagem-erro"></small>

                    </div>


                    <div class="campo">

                        <label for="estado">
                            Estado:
                        </label>

                        <input
                            type="text"
                            id="estado"
                            name="estado"
                            maxlength="2"
                            placeholder="SP"
                            autocomplete="address-level1">

                        <small class="mensagem-erro"></small>

                    </div>


                    <button type="submit">
                        Cadastrar
                    </button>


                    <p
                        class="mensagem-formulario"
                        id="mensagemFormulario"
                        role="status"
                        aria-live="polite">
                    </p>

                </fieldset>

            </form>

        </section>

    </main>


    <footer>
        <p>ONG Rodrigues - Todos os direitos reservados</p>
    </footer>

</body>

</html>
